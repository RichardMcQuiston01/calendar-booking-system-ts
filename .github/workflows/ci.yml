name: CI

on:
  pull_request:
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs git after checkout.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as publish.yml, so CI and releases agree.
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

      # `typecheck` is tsc --noEmit, which does not exercise declaration
      # emit — the thing consumers actually import.
      - run: bun run build
