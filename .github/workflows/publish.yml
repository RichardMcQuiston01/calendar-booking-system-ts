name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here runs git after checkout, so the token should not stay
          # readable by the dependency install and test steps below.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a release should not change because Bun shipped a new
          # version between publishes.
          bun-version: 1.3.11

      # setup-node is what writes the .npmrc that `npm publish` authenticates with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Publishing the wrong version under the right name cannot be undone
      # after 72 hours, so both entry points are checked: a release has to be
      # tagged to match package.json, and a manual run has to come from the
      # default branch rather than an arbitrary ref. Runs before install so a
      # bad context fails in seconds.
      - name: Verify publish context
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$EVENT" = "release" ]; then
            tag="${REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "Release tag '$tag' does not match package.json version '$version'" >&2
              exit 1
            fi
          else
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Manual publish must run from '$DEFAULT_BRANCH', got '$REF_NAME'" >&2
              exit 1
            fi
          fi
          echo "Publishing $version from $EVENT ($REF_NAME)"

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

      # prepublishOnly runs `bun run build`, so dist/ is emitted here.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
